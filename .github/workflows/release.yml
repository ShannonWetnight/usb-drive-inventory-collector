name: Publish Signed Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example vX.Y.Z'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: signed-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Check release source and signing configuration
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
          SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if ($env:RELEASE_REF -ne 'refs/heads/main') { throw 'Run the release workflow from main.' }
          if ($env:RELEASE_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Use a version like vX.Y.Z.' }
          # Release metadata cannot change an existing tag's source archives.
          $tagRef = "refs/tags/$($env:RELEASE_VERSION)"
          $tagLines = @(git ls-remote origin $tagRef "$tagRef^{}")
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the release tag.' }
          if ($tagLines.Count -gt 0) {
            $peeled = @($tagLines | Where-Object { ($_ -split '\s+')[1] -eq "$tagRef^{}" })
            $tagCommit = if ($peeled.Count -gt 0) { ($peeled[0] -split '\s+')[0] } else { ($tagLines[0] -split '\s+')[0] }
            if ($tagCommit -ne $env:GITHUB_SHA) {
              throw "Release tag $env:RELEASE_VERSION points to $tagCommit, but this build uses $env:GITHUB_SHA. Use a new version; published tags must not be moved."
            }
          }
          [xml]$project = Get-Content 'WindowsApp/USBDriveInventoryCollector.csproj'
          $applicationVersion = [string]$project.Project.PropertyGroup.Version
          if ($applicationVersion -ne $env:RELEASE_VERSION.Substring(1)) { throw "Requested release $env:RELEASE_VERSION, but the application version is v$applicationVersion. Update the application version or run the workflow with v$applicationVersion." }
          foreach ($name in @('SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE', 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing release setting: $name" }
          }
          if (-not (Test-Path ".github/release-notes/$($env:RELEASE_VERSION).md")) { throw 'Release notes are missing.' }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows x64 executable
        shell: pwsh
        run: dotnet publish WindowsApp/USBDriveInventoryCollector.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false --output publish
      - name: Azure login with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign EXE as Shannon Wetnight
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\publish\USB-Drive-Inventory-Collector-${{ inputs.version }}.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify publisher and create checksum
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "publish/USB-Drive-Inventory-Collector-$($env:RELEASE_VERSION).exe"
          $signature = Get-AuthenticodeSignature -FilePath $exe
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "Authenticode verification failed: $($signature.Status)"
          }
          $publisher = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($publisher -ne 'Shannon Wetnight') { throw "Unexpected publisher: $publisher" }
          $digest = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          "$digest *USB-Drive-Inventory-Collector-$($env:RELEASE_VERSION).exe" | Set-Content -Encoding ascii (Join-Path $env:GITHUB_WORKSPACE 'publish/SHA256SUMS.txt')
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "publish/USB-Drive-Inventory-Collector-$($env:RELEASE_VERSION).exe"
          $sums = Join-Path $env:GITHUB_WORKSPACE 'publish/SHA256SUMS.txt'
          $license = Join-Path $env:GITHUB_WORKSPACE 'publish/LICENSE'
          # Create a missing tag without force, then verify its peeled commit.
          # Repeat the check after signing to catch changes during the build.
          $tagRef = "refs/tags/$($env:RELEASE_VERSION)"
          $tagLines = @(git ls-remote origin $tagRef)
          if ($LASTEXITCODE -ne 0) { throw 'Could not check the release tag before publication.' }
          if ($tagLines.Count -eq 0) {
            git push origin "$($env:GITHUB_SHA):$tagRef"
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release tag without overwriting an existing tag.' }
          }
          git fetch --no-tags origin $tagRef
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the release tag for verification.' }
          $tagCommit = git rev-parse 'FETCH_HEAD^{}'
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
            throw "Release tag does not match build source $env:GITHUB_SHA. Publication stopped."
          }
          gh release create "$env:RELEASE_VERSION" "$exe" "$sums" "$license" --verify-tag --target "$env:GITHUB_SHA" --title "USB Drive Inventory Collector $env:RELEASE_VERSION" --notes-file ".github/release-notes/$($env:RELEASE_VERSION).md"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
