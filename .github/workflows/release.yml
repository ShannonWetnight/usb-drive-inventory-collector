name: Publish Signed Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v4.1.0'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check release source and signing configuration
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_VERSION: ${{ inputs.version }}
          SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if ($env:RELEASE_REF -ne 'refs/heads/main') { throw 'Run the release workflow from main.' }
          if ($env:RELEASE_VERSION -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Use a version like v4.1.0.' }
          [xml]$project = Get-Content 'WindowsApp/USBDriveInventoryCollector.csproj'
          if ($project.Project.PropertyGroup.Version -ne $env:RELEASE_VERSION.Substring(1)) { throw 'Release version does not match the application version.' }
          foreach ($name in @('SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE', 'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing release setting: $name" }
          }
          if (-not (Test-Path ".github/release-notes/$($env:RELEASE_VERSION).md")) { throw 'Release notes are missing.' }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows x64 executable
        shell: pwsh
        run: dotnet publish WindowsApp/USBDriveInventoryCollector.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false --output publish
      - name: Azure login with OpenID Connect
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign EXE as Shannon Wetnight
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\publish\USB-Drive-Inventory-Collector.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify publisher and create checksum
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'publish/USB-Drive-Inventory-Collector.exe'
          $signature = Get-AuthenticodeSignature -FilePath $exe
          if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate) {
            throw "Authenticode verification failed: $($signature.Status)"
          }
          $publisher = $signature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($publisher -ne 'Shannon Wetnight') { throw "Unexpected publisher: $publisher" }
          $digest = (Get-FileHash -Algorithm SHA256 -Path $exe).Hash.ToLowerInvariant()
          "$digest *USB-Drive-Inventory-Collector.exe" | Set-Content -Encoding ascii (Join-Path $env:GITHUB_WORKSPACE 'publish/SHA256SUMS.txt')
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'publish/USB-Drive-Inventory-Collector.exe'
          $sums = Join-Path $env:GITHUB_WORKSPACE 'publish/SHA256SUMS.txt'
          gh release create "$env:RELEASE_VERSION" "$exe" "$sums" --target "$env:GITHUB_SHA" --title "USB Drive Inventory Collector $env:RELEASE_VERSION" --notes-file ".github/release-notes/$($env:RELEASE_VERSION).md"
