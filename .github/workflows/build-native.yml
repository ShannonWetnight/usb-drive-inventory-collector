name: Build Windows GUI
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
jobs:
  windows-gui:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Read application version
        id: app-version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'WindowsApp/USBDriveInventoryCollector.csproj'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$($project.Project.PropertyGroup.Version)"
      - name: Publish self-contained executable
        run: dotnet publish WindowsApp/USBDriveInventoryCollector.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false --output publish
      - name: Verify generated workbook
        shell: pwsh
        run: |
          if (-not (Test-Path 'publish/LICENSE')) { throw 'Published license is missing.' }
          if ((Get-Content 'publish/LICENSE' -Raw) -notmatch '(?m)^Attributions:\r?$') { throw 'Published LICENSE is missing attributions.' }
          $path = Join-Path $env:RUNNER_TEMP 'Collector-Workbook-Check.xlsx'
          $exe = Join-Path (Resolve-Path publish) 'USB-Drive-Inventory-Collector-v${{ steps.app-version.outputs.version }}.exe'
          $result = Start-Process -FilePath $exe -ArgumentList @('--verify-workbook', $path) -Wait -PassThru
          if ($result.ExitCode -ne 0) {
            if (Test-Path "$path.error.txt") { Get-Content "$path.error.txt" }
            throw 'Workbook generation or round trip failed.'
          }
          python -m pip install --quiet openpyxl==3.1.5
          python -c "from openpyxl import load_workbook; import sys; w=load_workbook(sys.argv[1]); assert w.active['C2'].value == 'TEST-SERIAL'" $path
      - uses: actions/upload-artifact@v6
        with:
          name: Theme-Previews-v${{ steps.app-version.outputs.version }}
          path: ${{ runner.temp }}/Collector-Theme-*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: Workbook-Compatibility-Sample-v${{ steps.app-version.outputs.version }}
          path: ${{ runner.temp }}/Collector-Workbook-Check.xlsx
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: USB-Drive-Inventory-Collector-v${{ steps.app-version.outputs.version }}-preview
          path: |
            publish/USB-Drive-Inventory-Collector-v${{ steps.app-version.outputs.version }}.exe
            publish/LICENSE
          if-no-files-found: error
