name: Build Windows GUI
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
jobs:
  windows-gui:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Read application version
        id: app-version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'WindowsApp/USBDriveInventoryCollector.csproj'
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$($project.Project.PropertyGroup.Version)"
      - name: Publish self-contained executable
        run: dotnet publish WindowsApp/USBDriveInventoryCollector.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -p:DebugSymbols=false --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: USB-Drive-Inventory-Collector-v${{ steps.app-version.outputs.version }}-preview
          path: publish/USB-Drive-Inventory-Collector-v${{ steps.app-version.outputs.version }}.exe
          if-no-files-found: error
